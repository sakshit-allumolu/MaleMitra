<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaleMitra (ಮಳೆ ಮಿತ್ರ) | Connected Monsoon Mobility & Civic Response</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Clean civic dashboard palette */
      :root {
        --primary-navy: #123047;
        --teal-accent: #0B8B95;
        --rain-blue: #3576B8;
        --amber-warning: #C78420;
        --red-danger: #B53A3A;
        --green-safe: #2E8540;
        --surface-bg: #F4F6F9;
        --card-bg: #FFFFFF;
        --border-color: #E2E8F0;
        --text-primary: #1E293B;
        --text-muted: #64748B;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        overflow-x: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: var(--surface-bg);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        z-index: 10;
      }
      @keyframes mm-spin {
        to { transform: rotate(360deg); }
      }

      /* ── Responsive layout utilities ───────────────────────────── */

      /* Main content padding */
      .mm-main-pad { padding: 16px; }
      @media (min-width: 640px)  { .mm-main-pad { padding: 20px; } }
      @media (min-width: 1024px) { .mm-main-pad { padding: 24px; } }

      /* Two-column grid: left sidebar | right content */
      .mm-two-col {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (min-width: 768px) {
        .mm-two-col { grid-template-columns: 320px 1fr; gap: 20px; }
      }
      @media (min-width: 1024px) {
        .mm-two-col { grid-template-columns: 380px 1fr; }
      }

      /* Two-column grid reversed: main content | right panel (citizen route view) */
      .mm-two-col-rev {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (min-width: 768px) {
        .mm-two-col-rev { grid-template-columns: 1fr 320px; gap: 20px; }
      }
      @media (min-width: 1024px) {
        .mm-two-col-rev { grid-template-columns: 1fr 380px; }
      }

      /* Sidebar scroll panel: cap height only on wide screens */
      .mm-panel-scroll {
        display: flex;
        flex-direction: column;
      }
      @media (min-width: 768px) {
        .mm-panel-scroll { max-height: 820px; }
      }

      /* Navbar subtitle: hide on small screens */
      .mm-nav-subtitle { display: none; }
      @media (min-width: 640px) { .mm-nav-subtitle { display: block; } }

      /* Navbar inner: tighter gap on mobile */
      .mm-nav-inner {
        max-width: 1440px;
        margin: 0 auto;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      @media (min-width: 768px) { .mm-nav-inner { padding: 12px 24px; gap: 12px; } }

      /* Navbar tab: hide label text on small screens, show only icon */
      .mm-nav-tab-label { display: none; }
      @media (min-width: 560px) { .mm-nav-tab-label { display: inline; } }

      /* Demo guide button: hide label on very small screens */
      .mm-demo-label { display: none; }
      @media (min-width: 480px) { .mm-demo-label { display: inline; } }

      /* Graph version badge: hide on tiny screens */
      .mm-graph-badge { display: none; }
      @media (min-width: 560px) { .mm-graph-badge { display: flex; } }

      /* Route search: origin/destination/button row — stack on mobile */
      .mm-route-inputs {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        align-items: flex-start;
      }
      @media (min-width: 640px) {
        .mm-route-inputs { grid-template-columns: 1fr 1fr; gap: 12px; }
      }
      @media (min-width: 900px) {
        .mm-route-inputs { grid-template-columns: 1fr 1fr auto; }
      }

      /* Inner two-column form grids (name/email, phone/team) — stack on mobile */
      .mm-form-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      @media (min-width: 500px) {
        .mm-form-row { grid-template-columns: 1fr 1fr; }
      }

      /* Admin workspace inner multi-column action rows */
      .mm-action-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        background-color: #F8FAFC;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #E2E8F0;
      }
      .mm-action-row input[type="text"] {
        flex: 1;
        min-width: 140px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
